# GitHub Pages (Jekyll) build settings.
# Keep repo tooling and agent docs off the public site.
exclude:
  - CLAUDE.md
  - AGENTS.md
  - DEPLOYMENT.md
  - PERFORMANCE_IMPROVEMENTS.md
  - README.md
  - publish.py
  - validate.sh
  - scripts
  - netlify.toml
  - vercel.json
  - package.json
  - package-lock.json
  - node_modules
  - blog/_template.html
